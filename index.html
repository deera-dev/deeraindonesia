<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font preload -->
    <link
      rel="preload"
      href="/fonts/braise.otf"
      as="font"
      type="font/otf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/thefabricant.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />

    <!-- Primary SEO -->
    <title>Deera Indonesia | Gamis &amp; Busana Muslim Premium</title>
    <meta
      name="description"
      content="Deera Indonesia menghadirkan koleksi gamis, busana muslim, dan pakaian wanita premium berkualitas tinggi. Tampil elegan dan syari dengan koleksi terbaru Deera."
    />
    <meta
      name="keywords"
      content="deera, deera indonesia, gamis, gamis premium, gamis terbaru, busana muslim, pakaian wanita muslim, gamis elegan, gamis syari, busana muslim premium, baju muslim wanita, gamis modern"
    />
    <meta name="author" content="Deera Indonesia" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://deera.id/catalog" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deera.id/" />
    <meta
      property="og:title"
      content="Deera Indonesia | Gamis &amp; Busana Muslim Premium"
    />
    <meta
      property="og:description"
      content="Koleksi gamis dan busana muslim premium dari Deera Indonesia. Tersedia di Pasar Tasik Cideng Jakarta dan Pasar Sandang Tegalgubug Cirebon."
    />
    <meta property="og:image" content="https://deera.id/og-image.jpg" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Deera Indonesia" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Deera Indonesia | Gamis &amp; Busana Muslim Premium"
    />
    <meta
      name="twitter:description"
      content="Koleksi gamis dan busana muslim premium dari Deera Indonesia."
    />
    <meta name="twitter:image" content="https://deera.id/og-image.jpg" />

    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Deera Indonesia" />

    <script type="application/ld+json">

        "location": [
          {
